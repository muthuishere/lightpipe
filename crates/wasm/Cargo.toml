[package]
name = "optical-wasm"
version = "0.1.0"
edition = "2021"
description = "wasm-bindgen wrapper around optical-core (S7). Implements docs/contracts/wasm-api.md."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
optical-core = { path = "../core" }
blake3 = "1"
flate2 = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[[bin]]
name = "bench_native"
path = "src/bin/bench_native.rs"

# wasm-pack runs these on the release artifact.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
