version: '3'

vars:
  ARTIFACTS: artifacts

tasks:
  default:
    desc: Show the spike ladder and its status
    cmds:
      - grep -E '^## S[0-9]|STATUS:' docs/spikes/PLAN.md | sed 's/\*\*//g'

  test:
    desc: Run every automated test (no hardware, no browser)
    cmds:
      - cargo test --workspace

  build:
    desc: Build the core crate
    cmds:
      - cargo build --workspace

  fmt:
    desc: Format
    cmds:
      - cargo fmt --all

  lint:
    desc: Clippy, warnings are errors
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  ci:
    desc: What CI runs
    cmds:
      - task: fmt
      - task: lint
      - task: test

  clean:artifacts:
    desc: Wipe generated artifacts
    cmds:
      - rm -rf {{.ARTIFACTS}} && mkdir -p {{.ARTIFACTS}}

  # ---- spikes: each is runnable by any human and leaves something to look at ----

  spike:0:
    desc: 'S0 palette + cell round-trip on a perfect channel -> artifacts/s0-frame.png'
    cmds:
      - mkdir -p {{.ARTIFACTS}}
      - cargo run --release --bin spike0

  spike:1:
    desc: 'S1 degraded-channel sweep (incl. potato camera) -> artifacts/s1-sweep.csv'
    cmds:
      - mkdir -p {{.ARTIFACTS}}
      - cargo run --release --bin spike1

  spike:2:
    desc: 'S2 frame header + CRC, false-accept rate -> artifacts/s2-integrity.txt'
    cmds:
      - mkdir -p {{.ARTIFACTS}}
      - cargo run --release --bin spike2

  spike:3:
    desc: 'S3 fountain across frames under loss -> artifacts/s3-overhead.csv'
    cmds:
      - mkdir -p {{.ARTIFACTS}}
      - cargo run --release --bin spike3

  spike:4:
    desc: 'S4 geometry: fiducials + homography under warp -> artifacts/s4-warped.png'
    cmds:
      - mkdir -p {{.ARTIFACTS}}
      - cargo run --release --bin spike4

  spike:5:
    desc: 'S5 chunked gzip pipeline, resume + BLAKE3 -> artifacts/s5-pipeline.txt'
    cmds:
      - mkdir -p {{.ARTIFACTS}}
      - cargo run --release --bin spike5

  e2e:
    desc: 'End-to-end: file -> frames -> simulated camera -> file, real KB/s per camera'
    cmds:
      - mkdir -p {{.ARTIFACTS}}
      - cargo run --release --bin e2e

  wasm:build:
    desc: 'Build the wasm bundle'
    cmds:
      - cd crates/wasm && wasm-pack build --target web --out-dir ../../app/src/wasm

  wasm:test:
    desc: 'S7: run the core test suite through wasm in Node (no browser)'
    cmds:
      - node harness/run.mjs

  app:dev:
    desc: 'S8: run the React app (builds the wasm bundle first)'
    deps: [wasm:build]
    cmds:
      - cd app && npm run dev

  app:test:
    desc: 'S8: build the app and run the Playwright e2e suite against the real core'
    cmds:
      - cd app && npx playwright install chromium
      - npm --prefix app ci && npm --prefix app run build && npm --prefix app run test:e2e

  app:build:
    desc: 'Production build of the app, exactly as GitHub Pages builds it'
    deps: [wasm:build]
    cmds:
      - cd app && npm ci && BASE_PATH=/lightpipe/ npm run build

  adr:
    desc: List architecture decisions
    cmds:
      - cat docs/adr/README.md

  spec:
    desc: OpenSpec dashboard
    cmds:
      - openspec list
